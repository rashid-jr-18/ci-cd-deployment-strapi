name: CI - Build and Push Docker Image

on:
  push:
    branches:
      - dev
    paths:
      - "**"   # run CI on any change (safe & simple)

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rashid

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t rashid:latest .

      - name: Push image to ECR
        run: |
          docker tag rashid:latest 301782007642.dkr.ecr.ap-south-1.amazonaws.com/rashid:latest
          docker push 301782007642.dkr.ecr.ap-south-1.amazonaws.com/rashid:latest
